[package]
name = "conjoint_companion_desktop"
version = "1.0.0"
description = "Desktop shell for Conjoint Companion"
authors = ["Jens Schüler"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11", features = [] }
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
