name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} quality
    env:
      # renv 1.2 installs with four parallel jobs by default. A serial restore
      # avoids dependants being built before their compiled dependencies exist.
      RENV_CONFIG_INSTALL_JOBS: 1
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Install macOS R build prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gettext
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          echo "CPPFLAGS=-I${GETTEXT_PREFIX}/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${GETTEXT_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${GETTEXT_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "${GETTEXT_PREFIX}/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: src-tauri/resources/shiny-app

      - run: npm ci
      - run: npm run build
      - run: npm run check:shiny
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: npm audit --audit-level=high

  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
